   ===================================================================== */

function ecgLoad(id){if(ECGR[id])return ECGR[id];const e=window.ECGD&&window.ECGD[id];if(!e)return null;
const cells=e.cells.map(c=>{const b=atob(c[4]),n=b.length>>1,v=new Float32Array(n);for(let i=0;i<n;i++){let x=b.charCodeAt(2*i)|(b.charCodeAt(2*i+1)<<8);if(x>32767)x-=65536;v[i]=x/100}return{l:c[0],r:c[1],t:c[2],d:c[3],v,fs:e.fs,rh:c[5]}});
return ECGR[id]={lay:e.lay,cells}}
function ecgSynth(d){const LY=[[0,3,6,9],[1,4,7,10],[2,5,8,11]],cells=[];for(let r=0;r<3;r++)for(let c=0;c<4;c++)cells.push({l:LDN[LY[r][c]],r,t:2.5*c,d:2.5,v:d[LY[r][c]].slice(c*1250,(c+1)*1250),fs:500,rh:0});cells.push({l:'II',r:3,t:0,d:10,v:d[1],fs:500,rh:1});return{lay:'c34r',cells}}
function ecgGeo(E){const L=E.lay;return{W:265,H:150,yb:(L==='c62'||L==='c34s')?[34,54,74,94,114,134]:L==='c34'?[48,82,116]:[38,68,98,128]}}
function ecgHR(E){const c=E.cells.find(x=>x.rh)||E.cells.filter(x=>x.l==='II').sort((a,b)=>b.d-a.d)[0]||E.cells[0],v=c.v,fs=c.fs,n=v.length,s=Array.from(v).sort((a,b)=>a-b),m=s[n>>1];let mx=0;for(let i=0;i<n;i++)mx=Math.max(mx,Math.abs(v[i]-m));
const th=.5*mx,pk=[],A=i=>Math.abs(v[i]-m);let last=-1e9;for(let i=1;i<n-1;i++){const a=A(i);if(a>=th&&a>=A(i-1)&&a>=A(i+1)){if(i-last>.2*fs){pk.push(i);last=i}else if(a>A(pk[pk.length-1])){pk[pk.length-1]=i;last=i}}}
if(pk.length<3)return'--';const rr=[];for(let i=1;i<pk.length;i++)rr.push(pk[i]-pk[i-1]);rr.sort((a,b)=>a-b);return Math.round(60*fs/rr[rr.length>>1])}
function ecgTraces(x,E,g,s,ox,oy,gn,upto){for(const c of E.cells){const xs=10+c.t*25,yb=g.yb[c.r],N=c.v.length;x.beginPath();let st=0;for(let i=0;i<N;i++){const mm=xs+i/c.fs*25;if(upto!=null&&mm>upto)break;const px=ox+mm*s,py=oy+yb*s-c.v[i]*gn*s;st?x.lineTo(px,py):(x.moveTo(px,py),st=1)}x.stroke()}}
function ecgLabels(x,E,g,s,ox,oy,F,fs){x.font='700 '+fs*s+'px '+F;const six=E.lay==='c62'||E.lay==='c34s';for(const c of E.cells){const xs=10+c.t*25,yb=g.yb[c.r];x.fillText(c.rh?c.l+'  (ritmo)':c.l,ox+(xs+1)*s,oy+(yb-(six?8:9))*s);if(c.t>0&&!c.rh){x.beginPath();x.moveTo(ox+xs*s,oy+(yb-2)*s);x.lineTo(ox+xs*s,oy+(yb+2)*s);x.stroke()}}}
function ecgLoopWin(c){if(c._lp)return c._lp;const v=c.v,N=v.length,fs=c.fs;let best=[0,N-1,1e9];const a=Math.floor(N*.3),z=Math.ceil(N*.7),st=Math.max(1,Math.floor(N/700));
for(let i=0;i<a;i+=st){const si=Math.abs(v[Math.min(N-1,i+2)]-v[i]);for(let k=z;k<N-1;k+=st){const sk=Math.abs(v[k]-v[k-2]),cs=Math.abs(v[i]-v[k])*3+(si+sk)*1.5+(i+N-k)*.0004*(250/fs);if(cs<best[2])best=[i,k,cs]}}
return c._lp={i0:best[0],L:Math.max(8,best[1]-best[0])}}
function ecgSweepPath(x,c,g,s,ox,oy,gn,cur,p,gap){const w=ecgLoopWin(c),v=c.v,fs=c.fs,N=v.length,xs=10+c.t*25,yb=g.yb[c.r],sh=Math.round(10*fs);x.beginPath();let pen=false;
for(let k=0;k<N;k++){const mm=xs+k/fs*25;let pass;if(mm<=cur)pass=p;else if(mm>=cur+gap&&p>0)pass=p-1;else{pen=false;continue}
const idx=w.i0+(((pass*sh+k)%w.L)+w.L)%w.L,px=ox+mm*s,py=oy+yb*s-v[idx]*gn*s;pen?x.lineTo(px,py):(x.moveTo(px,py),pen=true)}x.stroke()}
function ecgScreen(cv,E,e,hr){const dp=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;if(cv.width!==Math.round(w*dp)||cv.height!==Math.round(h*dp)){cv.width=Math.round(w*dp);cv.height=Math.round(h*dp)}
const x=cv.getContext('2d'),g0=ecgGeo(E),s=Math.min(cv.width/g0.W,cv.height/g0.H),fy=Math.max(1,Math.min(1.8,cv.height/(g0.H*s))),g={W:g0.W,H:g0.H*fy,yb:g0.yb.map(v=>v*fy)},ox=(cv.width-g.W*s)/2,oy=(cv.height-g.H*s)/2,sk=K||SKN.act,light=skin==='co'&&!NT,F='"Inter","Segoe UI",Roboto,Arial,sans-serif',tc=light?'#111':sk.c[0];

x.fillStyle=light?'#4a6770':'#8fa9ab';x.font='500 '+3*s+'px '+F;x.fillText('25 mm/s   10 mm/mV   0,5–40 Hz',ox+10*s,oy+8*s);
x.lineJoin='round';x.lineCap='round';x.strokeStyle=tc;x.lineWidth=Math.max(1.4*dp,.42*s);
const cyc=e*25,p=Math.floor(cyc/250),cur=10+(cyc%250);for(const c of E.cells)ecgSweepPath(x,c,g,s,ox,oy,10,cur,p,5);
x.fillStyle=light?'#27495a':'#9fc2c0';x.lineWidth=Math.max(1,dp);ecgLabels(x,E,g,s,ox,oy,F,4.2);
x.strokeStyle=light?'rgba(20,50,60,.35)':'rgba(255,255,255,.18)';x.beginPath();x.moveTo(ox+cur*s,oy+12*s);x.lineTo(ox+cur*s,oy+g.H*s);x.stroke()}
function ecgPaper(cv,E,gn,k,hr){const dp=devicePixelRatio||1,g=ecgGeo(E),W=g.W,H=g.H,s=k*dp,F='"Inter","Segoe UI",Roboto,Arial,sans-serif';cv.style.width=W*k+'px';cv.style.height=H*k+'px';cv.width=Math.round(W*s);cv.height=Math.round(H*s);const x=cv.getContext('2d'),X=m=>m*s;
x.fillStyle='#fffdfb';x.fillRect(0,0,cv.width,cv.height);
const grid=(st,col,w)=>{x.strokeStyle=col;x.lineWidth=w;x.beginPath();for(let i=0;i<=W;i+=st){x.moveTo(X(i),0);x.lineTo(X(i),cv.height)}for(let i=0;i<=H;i+=st){x.moveTo(0,X(i));x.lineTo(cv.width,X(i))}x.stroke()};grid(1,'#f8dcdc',Math.max(1,.4*dp));grid(5,'#eda0a0',Math.max(1.2,.9*dp));
x.fillStyle='#111';x.font='700 '+3.6*s+'px '+F;x.fillText('ECG de 12 derivaciones',X(10),X(7));x.font='500 '+3*s+'px '+F;x.fillText('ID Pac.: n/d    FC: '+hr+' lpm',X(10),X(13));x.fillText('25 mm/s    '+gn+' mm/mV    Filtro 0,5–40 Hz',X(10),X(18));x.textAlign='right';x.fillText(new Date().toLocaleString('es-ES'),X(260),X(7));x.font='italic 500 '+2.4*s+'px '+F;x.fillText('Simulación docente: registro para formación, no es un paciente real',X(260),X(148));x.textAlign='left';
x.strokeStyle='#111';x.lineJoin='round';x.lineCap='round';x.lineWidth=Math.min(3*dp,Math.max(1.1*dp,.3*s));
for(const yb of g.yb){x.beginPath();x.moveTo(X(1),X(yb));x.lineTo(X(2),X(yb));x.lineTo(X(2),X(yb)-gn*s);x.lineTo(X(7),X(yb)-gn*s);x.lineTo(X(7),X(yb));x.lineTo(X(9),X(yb));x.stroke()}
ecgTraces(x,E,g,s,0,0,gn,null);x.fillStyle='#111';x.lineWidth=Math.max(1,.2*s);ecgLabels(x,E,g,s,0,0,F,3.4)}
