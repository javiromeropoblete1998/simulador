<script>
/* Pantalla completa automática: sin barra de estado ni de navegación. Los navegadores exigen un gesto del usuario,
   así que entra en el primer toque en cualquier sitio de la app. (Instalada en el inicio, el manifest ya la abre a pantalla completa.) */
(function(){var d=document,e=d.documentElement,done=0,tries=0;
function on(){return d.fullscreenElement||d.webkitFullscreenElement||matchMedia('(display-mode: fullscreen)').matches}
function go(){if(on()){off();return}var r=e.requestFullscreen||e.webkitRequestFullscreen;if(!r){off();return}
var p;try{p=r.call(e,{navigationUI:'hide'})}catch(_){}if(p&&p.catch)p.catch(function(){});if(++tries>=3)off()}
function off(){if(done)return;done=1;['pointerup','touchend','click','keydown'].forEach(function(t){d.removeEventListener(t,go,true)})}
if(matchMedia('(display-mode: fullscreen)').matches)return;
['pointerup','touchend','click','keydown'].forEach(function(t){d.addEventListener(t,go,true)})})();
</script>
<script>
/* Altura real visible: mide la ventana de verdad (sin la barra del navegador) y la actualiza al cambiar, así no hace falta deslizar la pantalla para que encaje */
(function(){var r=document.documentElement,last=0;
function vh(){var h=Math.round(window.innerHeight||r.clientHeight);if(h>0&&h!==last){last=h;r.style.setProperty('--vh',h+'px')}}
vh();['resize','orientationchange','fullscreenchange','webkitfullscreenchange','pageshow','focus','scroll'].forEach(function(t){addEventListener(t,function(){vh();if(t==='orientationchange')setTimeout(vh,350)},{passive:true})});
if(window.visualViewport)visualViewport.addEventListener('resize',vh);
[80,300,800,1800,3500].forEach(function(t){setTimeout(vh,t)});setInterval(vh,1000)})();
</script>
